domain: mission_orchestration
display_name: BOND-ORCHESTRATOR (DAG 00) — Mission DAG Runner
required_packages:
  - pyyaml
  - pytest
preferred_outputs:
  - json
  - csv
  - pdf
  - html
validation_gates:
  - coverage_gate
  - zero_mock_policy
  - determinism_check
  - manuscript_token_crossref
artifact_expectations:
  - output/data/mission_report.json
  - output/data/provenance/outcomes.json
  - output/data/provenance/provenance.csv
  - output/data/manuscript_variables.json
  - output/state/OPERATION_OMNIBUS/manifest.json
source_policy: "Prefer primary project outputs (mission reports, provenance records) and official protocol documentation."
review_gates:
  - coverage_gate
  - determinism_check
  - protocol_conformance
benchmark_rubric:
  name: orchestrator-readiness
  dimensions:
    - name: deterministic_execution
      weight: 2.0
    - name: checkpoint_resume
      weight: 2.0
    - name: provenance_completeness
      weight: 1.0
    - name: protocol_conformance
      weight: 1.0
    - name: coverage_gate
      weight: 1.0
llm_prompt_guidance: "Use generated mission reports, provenance records, and manuscript variables as the evidence source; do not invent numeric results. Report measured values as observed."
