# Code Project Configuration
# Self-contained: no ancestor pyproject.toml declares [tool.ruff] or [tool.mypy], so
# every tool setting this checkout obeys is in this file.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-orchestrator"
version = "2.5.2"
license = {text = "MIT"}
description = "BOND-ORCHESTRATOR (DAG 00): Layer 3 mission DAG runner — multi-package film missions over the MissionProvider protocol with checkpoint/resume and provenance"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
# Runtime dependencies are exactly what src/ imports. numpy, matplotlib and
# defusedxml were inherited from the template_code_project fork and imported
# nowhere in this package; they were removed rather than left as decoration.
# tests/test_packaging.py::test_declared_runtime_dependencies_are_imported
# fails if a declared dependency stops being imported (or an import appears
# with no declaration), so this list cannot silently drift again.
dependencies = [
    "pyyaml>=6.0",
    "bond-api",
]

# Local path dependency so the FROZEN bond-api protocol is importable when
# binding real film providers (film_providers.py imports it lazily; the pure
# core stays liftable without it).
#
# Relative, not absolute: an absolute path pins the package to one machine's
# home directory and breaks every other checkout. Resolved relative to this
# pyproject.toml. Gated by tests/test_packaging.py::test_bond_api_source_is_relative.
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # tests/test_packaging.py parses this file; tomllib is stdlib only on 3.11+.
    "tomli>=2.0.0; python_version < '3.11'",
    # TEST-ONLY, not a dependency of this package's core. tests/test_film_binding.py
    # imports the sibling film packages straight from their own src/ trees, so this
    # venv must satisfy *their* imports too; `spectre` imports numpy. Nothing under
    # bond-orchestrator's own src/ or scripts/ imports it — verified by
    # tests/test_packaging.py::test_every_third_party_import_is_declared.
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Self-contained mypy config: no ancestor pyproject.toml declares [tool.mypy], so
# this table is the effective one. The `yaml` override at the end supplies
# ignore_missing_imports, so no stub package is needed — types-PyYAML is in neither
# the dev extra nor the lock (measured).
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.uv]
# Nothing is inherited here: the only pyproject.toml above this checkout belongs to
# the vault manager project and is not this project's workspace root, and this
# repository carries its own lock.

[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
# The width this tree is written to, measured: with this line the documented format
# gate reports 20 files already formatted and the documented check reports 28
# findings; with the line removed (the formatter's default) it reports 11 files
# that would be reformatted and 31 findings. Committed so the width travels with
# the checkout — ruff selects the nearest config and merges nothing.
line-length = 120
