# BOND-ORCHESTRATOR configuration (Layer 3 — mission DAG runner)
# Meta-artifact linking manuscript prose to the execution layer.
# Loaded by `yaml.safe_load` inside scripts/generate_manuscript_variables.py
# via src/bond_orchestrator/manuscript_variables.py::load_project_config.

identity:
  name: "BOND-ORCHESTRATOR"
  codename: "DAG 00"
  layer: "Layer 3 — multi-package mission DAG runner"

paper:
  title: "BOND-ORCHESTRATOR: A Deterministic Mission DAG Runner"
  subtitle: "Multi-package film missions over the MissionProvider protocol, with cycle-path detection, checkpoint/resume, bounded deterministic retry, parallel-stage planning, real-film binding, and provenance"
  version: "2.5.2"
  date: "2026-08-04"

# Consumed by: `infrastructure.publishing.extract_publication_metadata` (in `infrastructure/publishing/metadata.py`)
authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

# PUBLICATION STATUS: UNPUBLISHED.
#
# This package has never been deposited, released, or hosted anywhere. It has
# no DOI, no standalone public repository, and no archival copies. Every field
# below is therefore empty on purpose — an empty field is the honest value.
#
# The previous contents of this block were inherited verbatim from the
# `template_code_project` exemplar this package was forked from, and pointed at
# that exemplar's artifacts, not this one. Specifically:
#   - DOI 10.5281/zenodo.20417136 resolves to "Convergence Analysis of Gradient
#     Descent Optimization" (a different work by the same author);
#   - https://github.com/docxology/bond-orchestrator returns 404;
#   - the declared netlify deployment serves that same gradient-descent paper,
#     and TestPyPI has no `bond-orchestrator` release.
# Do not repopulate any field here until a real deposit exists and its
# identifier has been checked against the live registry.
publication:
  doi: ""
  version_doi: ""
  version_record: ""
  github_repository: ""
  repository_url: ""
  published_artifacts: {}
  # Disabled: transmission bookends render `published_artifacts` into the PDF.
  # With no artifacts to declare there is nothing truthful to render.
  transmission_bookends:
    enabled: false
    max_prior_releases: 5
    show_steganography: true
  deposit_filename:
    enabled: true
    topic: ""
  # No journal: this manuscript has not been submitted to or accepted by any
  # venue. The previous value ("Journal of Mission Orchestration", vol. 1,
  # pp. 1-12) named a venue that does not exist.
  journal: ""
  volume: ""
  pages: ""
  year: "2026"

keywords:
  - "mission orchestration"
  - "DAG scheduling"
  - "topological order"
  - "cycle detection"
  - "checkpoint/resume"
  - "fault tolerance"
  - "bounded retry"
  - "wavefront stage planning"
  - "critical path"
  - "protocol adapter"
  - "deterministic execution"
  - "provenance"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

steganography:
  enabled: true
  overlays_enabled: true
  barcodes_enabled: true
  metadata_enabled: true
  hashing_enabled: true
  encryption_enabled: false
  overlay_mode: "text"
  overlay_text: "CONFIDENTIAL"

render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: true
    epub: true

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Mission parameters — read by scripts/run_mission.py consumers and
# scripts/generate_manuscript_variables.py; the canonical OPERATION OMNIBUS.
mission:
  name: "OPERATION_OMNIBUS"
  packages: [goldfinger, goldeneye, no_time_to_die]
  phases: [brief, recon, plan, execute, debrief]
  # Default retry policy documented for the manuscript; the CLI overrides via
  # --retry-max-attempts (1 = no retry, immediate deterministic re-attempts).
  retry:
    max_attempts: 1
